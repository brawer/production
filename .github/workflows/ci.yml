name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Format check
        run: tofu fmt -check -recursive -diff

      - name: Init
        run: tofu init -backend=false
        working-directory: bunny

      - name: Validate
        run: tofu validate
        working-directory: bunny
