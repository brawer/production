name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Format check
        run: tofu fmt -check -recursive -diff

      # The provider blocks (and infomaniak-k8s's S3-credentials local) read
      # gitignored secrets/ files. validate/init never contact any API, so
      # placeholders are enough.
      - name: Provide placeholder secrets
        run: |
          echo "ci-placeholder" > secrets/bunny_api_key
          echo "ci-placeholder" > secrets/infomaniak_api_token
          echo '{"placeholder": "value"}' > secrets/infomaniak_cronjob_s3_credentials.json
          echo "ci-placeholder" > secrets/infomaniak_openstack_password

      # Retry: OpenTofu re-fetches provider signatures from GitHub's release
      # CDN on every init (even with a pinned lock file), which intermittently
      # returns 504.
      - name: Init and validate
        run: |
          for dir in bunny infomaniak infomaniak-k8s infomaniak-s3-auth infomaniak-storage; do
            for attempt in 1 2 3 4 5; do
              tofu -chdir="$dir" init -backend=false && break
              echo "::warning::tofu init ($dir) attempt $attempt failed; retrying in 20s"
              sleep 20
              if [ "$attempt" = 5 ]; then exit 1; fi
            done
            tofu -chdir="$dir" validate
          done
