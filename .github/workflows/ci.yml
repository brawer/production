name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.12.6"

      - name: Format check
        run: tofu fmt -check -recursive -diff

      # The provider block reads secrets/bunny_api_key, which is gitignored.
      # validate/init never contact the API, so a placeholder is enough.
      - name: Provide placeholder API key
        run: echo "ci-placeholder" > secrets/bunny_api_key

      # Retry: OpenTofu re-fetches provider signatures from GitHub's release
      # CDN on every init (even with a pinned lock file), which intermittently
      # returns 504.
      - name: Init
        run: |
          for attempt in 1 2 3 4 5; do
            tofu init -backend=false && exit 0
            echo "::warning::tofu init attempt $attempt failed; retrying in 20s"
            sleep 20
          done
          exit 1
        working-directory: bunny

      - name: Validate
        run: tofu validate
        working-directory: bunny
