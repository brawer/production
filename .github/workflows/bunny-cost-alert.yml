# Month-to-date spend tripwire for the Bunny account. Runs daily, reads the
# billing endpoint, and FAILS the run (which emails the repo admins) when
# charges cross ~EUR 30 or the prepaid balance drops near zero.
#
# This is only the heads-up. The hard ceiling is elsewhere: the per-pull-zone
# `limit_bandwidth` caps in bunny/cdn.tf, and - the real backstop - the prepaid
# balance itself, since auto-recharge is left OFF and Bunny suspends zones on a
# negative balance rather than charging a card.
#
# Setup: add a repo secret BUNNY_API_KEY holding the Bunny account API key (the
# same value as secrets/bunny_api_key locally). Bunny has no scoped keys, so
# this is the full-access account key - GitHub encrypts it at rest and masks it
# in logs, but treat the exposure as real.

name: Bunny cost alert

on:
  schedule:
    - cron: "17 7 * * *" # daily, 07:17 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Bunny bills in USD; these are rough EUR targets.
      ALERT_USD: "32" # ~EUR 30 month-to-date charges
      LOW_BALANCE_USD: "10" # top up before zones get suspended
    steps:
      - name: Check Bunny billing
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          set -euo pipefail

          resp="$(curl -fsS -H "AccessKey: $BUNNY_API_KEY" https://api.bunny.net/billing)"

          charges="$(jq -r '.ThisMonthCharges // empty' <<<"$resp")"
          balance="$(jq -r '.Balance // empty' <<<"$resp")"

          if [ -z "$charges" ] || [ -z "$balance" ]; then
            echo "::error::Unexpected /billing response - missing ThisMonthCharges/Balance:"
            jq -S 'with_entries(select(.value | type != "array" and type != "object"))' <<<"$resp" || echo "$resp"
            exit 1
          fi

          {
            echo "### Bunny billing"
            echo
            echo "| Metric | USD |"
            echo "| --- | --- |"
            echo "| Month-to-date charges | \$$charges |"
            echo "| Account balance | \$$balance |"
            echo
            echo "Thresholds: alert at \$$ALERT_USD, low-balance floor \$$LOW_BALANCE_USD."
          } >>"$GITHUB_STEP_SUMMARY"

          status=0
          if jq -e --argjson t "$ALERT_USD" '.ThisMonthCharges > $t' <<<"$resp" >/dev/null; then
            echo "::error::Bunny month-to-date charges \$$charges exceed the \$$ALERT_USD (~EUR 30) alert threshold."
            status=1
          fi
          if jq -e --argjson t "$LOW_BALANCE_USD" '.Balance < $t' <<<"$resp" >/dev/null; then
            echo "::error::Bunny balance \$$balance is below \$$LOW_BALANCE_USD - top up before zones are suspended."
            status=1
          fi
          exit $status
